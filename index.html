<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horta Inteligente – Dashboard</title>

    <!-- Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f2f5f9;
        }

        header {
            background: #1b5e20;
            padding: 20px;
            color: white;
            font-size: 26px;
            text-align: center;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .dashboard {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<header>Horta Inteligente – Dashboard</header>

<div class="dashboard">

    <div class="card">
        <h2>Temperatura Ambiente</h2>
        <div id="temp_chart" style="width: 100%; height: 350px;"></div>
    </div>

    <div class="card">
        <h2>Umidade do Solo</h2>
        <div id="umid_chart" style="width: 100%; height: 350px;"></div>
    </div>

    <div class="card">
        <h2>LDR (Luminosidade)</h2>
        <div id="ldr_chart" style="width: 100%; height: 350px;"></div>
    </div>

</div>

<script>
// === ID da Sua Planilha ===
const sheetID = "11eUrf6mdpcyYNuBGWYTiusNMW44qyvnCZ88HSZjWa6M";

// Carregar Google Charts
google.charts.load("current", { packages: ["corechart"] });
google.charts.setOnLoadCallback(updateCharts);

// Função para consultar dados no Google Sheets
function querySheet(query, callback) {
    let url =
        `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(query)}`;

    fetch(url)
        .then(res => res.text())
        .then(text => {
            const json = JSON.parse(text.substring(47, text.length - 2));
            const table = new google.visualization.DataTable(json.table);
            callback(table);
        })
        .catch(err => console.error("Erro carregando dados:", err));
}

// Atualizar os 3 gráficos
function updateCharts() {

    // Temperatura (colunas A,B)
    querySheet("select A,B", table => {
        const chart = new google.visualization.LineChart(document.getElementById("temp_chart"));
        chart.draw(table, {
            curveType: "function",
            legend: "none",
            chartArea: { width: "85%", height: "70%" }
        });
    });

    // Umidade do Solo (colunas A,D)
    querySheet("select A,D", table => {
        const chart = new google.visualization.LineChart(document.getElementById("umid_chart"));
        chart.draw(table, {
            curveType: "function",
            legend: "none",
            chartArea: { width: "85%", height: "70%" }
        });
    });

    // LDR (colunas A,C)
    querySheet("select A,C", table => {
        const chart = new google.visualization.LineChart(document.getElementById("ldr_chart"));
        chart.draw(table, {
            curveType: "function",
            legend: "none",
            chartArea: { width: "85%", height: "70%" }
        });
    });
}

// Atualiza suavemente a cada 5s
setInterval(updateCharts, 5000);
</script>

</body>
</html>
