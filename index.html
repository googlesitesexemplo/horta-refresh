<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horta Inteligente - Gráficos</title>

    <!-- Auto-refresh -->
    <meta http-equiv="refresh" content="60">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #4CAF50;
            padding: 18px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* GRID RESPONSIVO */
        .grid {
            display: grid;
            gap: 20px;
            padding: 20px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        /* CARD DOS GRÁFICOS */
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .card h2 {
            margin-top: 0;
            text-align: center;
            font-size: 20px;
            color: #333;
        }

        iframe {
            width: 100%;
            height: 330px;
            border: none;
        }
    </style>
</head>
<body>

<header>
    Horta Inteligente – Monitoramento em Tempo Real
</header>

<div class="grid">

    <!-- Temperatura -->
    <div class="card">
        <h2>Temperatura</h2>
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pubchart?oid=1587001746&format=interactive"></iframe>
    </div>

    <!-- Umidade -->
    <div class="card">
        <h2>Umidade</h2>
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pubchart?oid=1798809069&format=interactive"></iframe>
    </div>

    <!-- LDR -->
    <div class="card">
        <h2>Intensidade Luminosa (LDR)</h2>
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pubchart?oid=1324451117&format=interactive"></iframe>
    </div>

</div>

</body>
</html>
