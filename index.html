<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Horta IoT</title>

    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            background: #eef1f5;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        h2 {
            margin: 0;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(420px,1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .chart {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>

<h1 style="text-align:center;">Dashboard – Horta Inteligente</h1>

<div class="grid">
    <div class="card">
        <h2>Temperatura (°C)</h2>
        <div id="chart_temp" class="chart"></div>
    </div>

    <div class="card">
        <h2>Umidade do Solo</h2>
        <div id="chart_umid" class="chart"></div>
    </div>

    <div class="card">
        <h2>LDR (Luminosidade)</h2>
        <div id="chart_ldr" class="chart"></div>
    </div>
</div>

<script>
google.charts.load("current", { packages: ["corechart"] });
google.charts.setOnLoadCallback(init);

let tempChart, umidChart, ldrChart;
let tempData, umidData, ldrData;

async function init() {
    tempChart = new google.visualization.LineChart(document.getElementById("chart_temp"));
    umidChart = new google.visualization.LineChart(document.getElementById("chart_umid"));
    ldrChart = new google.visualization.LineChart(document.getElementById("chart_ldr"));

    tempData = new google.visualization.DataTable();
    tempData.addColumn("datetime", "Tempo");
    tempData.addColumn("number", "Temperatura");

    umidData = new google.visualization.DataTable();
    umidData.addColumn("datetime", "Tempo");
    umidData.addColumn("number", "Umidade");

    ldrData = new google.visualization.DataTable();
    ldrData.addColumn("datetime", "Tempo");
    ldrData.addColumn("number", "LDR");

    await updateData();
    setInterval(updateData, 2000); // Atualiza a cada 2 segundos (rápido)
}

async function updateData() {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pub?gid=1104825372&single=true&output=csv";
    const csv = await (await fetch(url)).text();
    const rows = Papa.parse(csv, { header: true }).data;

    let last = rows[rows.length - 2];

    const t = new Date(last.DateTime);
    const temp = parseFloat(last.Temperatura.replace(",", "."));
    const umid = parseFloat(last.Umidade.replace(",", "."));
    const ldr = parseFloat(last.LDR.replace(",", "."));

    appendPoint(tempData, t, temp);
    appendPoint(umidData, t, umid);
    appendPoint(ldrData, t, ldr);

    drawCharts();
}

function appendPoint(table, time, value) {
    table.addRow([time, value]);

    if (table.getNumberOfRows() > 60) {
        table.removeRow(0);
    }
}

function drawCharts() {
    const opts = {
        legend: { position: "none" },
        curveType: "none", // LINHA RETA
        chartArea: { left: 40, right: 20, top: 10, bottom: 30 }
    };

    tempChart.draw(tempData, opts);
    umidChart.draw(umidData, opts);
    ldrChart.draw(ldrData, opts);
}
</script>

</body>
</html>
