<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento da Horta</title>

    <!-- Google Charts -->
    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <!-- PapaParse para ler CSV do Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #chart_temp {
            width: 100%;
            height: 400px;
            margin: auto;
        }
    </style>
</head>
<body>

<h1>Temperatura Ambiente</h1>
<div id="chart_temp"></div>

<script>
google.charts.load('current', {'packages':['corechart']});
google.charts.setOnLoadCallback(initChart);

let chart;
let dataTable;

function initChart() {
    chart = new google.visualization.LineChart(document.getElementById('chart_temp'));
    fetchAndDraw();
    setInterval(fetchAndDraw, 5000); // atualiza a cada 5 segundos
}

async function fetchAndDraw() {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pub?gid=1104825372&single=true&output=csv";

    const response = await fetch(url);
    const csv = await response.text();

    const rows = Papa.parse(csv, { header: true }).data;

    let parsed = rows.map(r => [
        new Date(r.DateTime),
        parseFloat(r.Temperatura.replace(',', '.'))
    ]);

    // Ordena por data/hora
    parsed.sort((a, b) => a[0] - b[0]);

    // Apenas os últimos 60 pontos
    parsed = parsed.slice(-60);

    dataTable = new google.visualization.DataTable();
    dataTable.addColumn('datetime', 'Tempo');
    dataTable.addColumn('number', 'Temperatura');
    dataTable.addRows(parsed);

    const options = {
        legend: 'none',

        // Linhas retas (sem curvas)
        curveType: 'none', // opcional, mas garantido

        hAxis: {
            textStyle: { fontSize: 12 }
        },
        vAxis: {
            textStyle: { fontSize: 12 }
        },

        chartArea: {
            left: 50,
            right: 20,
            top: 20,
            bottom: 50
        }
    };

    chart.draw(dataTable, options);
}
</script>

</body>
</html>
