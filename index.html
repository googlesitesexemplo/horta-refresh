<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horta Inteligente - Auto Refresh</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    iframe {
      border: none;
      width: 100vw;
      height: 100vh;
    }

    .notice {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="notice">Auto-refresh a cada 60s. Se precisar alterar, edite <code>index.html</code>.</div>
  <iframe 
      src="https://sites.google.com/view/hostainteligente/in%C3%ADcio" 
      allowfullscreen>
  </iframe>
</body>
</html>
