<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Horta Inteligente — Dashboard (Google Charts CSV)</title>

<!-- Google Charts -->
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
  :root{--accent:#1b5e20;--bg:#f2f5f9}
  body{margin:0;font-family:Inter, "Segoe UI", Arial, sans-serif;background:var(--bg);color:#222}
  header{background:var(--accent);color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:700;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .wrap{max-width:1150px;margin:26px auto;padding:0 18px}
  .card{background:#fff;border-radius:16px;padding:26px;margin-bottom:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  h2{text-align:center;margin:0 0 12px 0;font-size:20px;color:#222}
  .chart{width:100%;height:420px}
  @media(max-width:900px){ .chart{height:340px} }
  @media(max-width:600px){ .chart{height:280px;padding:0} h2{font-size:18px} .card{padding:18px} }
  .meta{font-size:13px;color:#666;text-align:center;margin-top:6px}
</style>
</head>
<body>
<header>Horta Inteligente — Dashboard</header>

<div class="wrap">
  <div class="card">
    <h2>Temperatura Ambiente</h2>
    <div id="chartTemp" class="chart"></div>
    <div id="metaTemp" class="meta"></div>
  </div>

  <div class="card">
    <h2>Umidade do Solo</h2>
    <div id="chartUmid" class="chart"></div>
    <div id="metaUmid" class="meta"></div>
  </div>

  <div class="card">
    <h2>LDR — Intensidade Luminosa</h2>
    <div id="chartLdr" class="chart"></div>
    <div id="metaLdr" class="meta"></div>
  </div>
</div>

<script>
/*
  Código:
  - lê CSV público exportado da aba View (pub?output=csv)
  - pega últimas ROW_LIMIT linhas
  - desenha 3 charts Google Charts (LineChart)
  - atualiza a cada UPDATE_INTERVAL_MS
  - redimensiona ao resize da janela
*/

/* --------- CONFIG --------- */
// CSV público (já convertido a partir do seu pubhtml)
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0mQVMtl99_QZzq-DpX4kDEz4vu35niLy5Yj3PDwVB3CMB2mc0R78S7LkXE-Oh7_rJwGmohGdaD_k_/pub?gid=1104825372&single=true&output=csv";

// quantas linhas mostrar (últimas N): ajuste aqui
const ROW_LIMIT = 10;

// intervalo de atualização (ms)
const UPDATE_INTERVAL_MS = 5000;

/* --------- Inicializar Google Charts --------- */
google.charts.load("current", { packages: ["corechart"] });
google.charts.setOnLoadCallback(init);

let chartTemp, chartUmid, chartLdr;
let optionsBase = {
  curveType: 'function',
  legend: { position: 'none' },
  animation: { duration: 300, easing: 'out' },
  hAxis: { textStyle: { fontSize: 11 }, slantedText: false },
  vAxis: { textStyle: { fontSize: 12 } },
  chartArea: { left: 60, top: 30, right: 20, bottom: 60, width: '88%', height: '72%' }
};

function init(){
  chartTemp = new google.visualization.LineChart(document.getElementById('chartTemp'));
  chartUmid = new google.visualization.LineChart(document.getElementById('chartUmid'));
  chartLdr  = new google.visualization.LineChart(document.getElementById('chartLdr'));

  // primeira carga
  updateAll();

  // loop de atualização
  setInterval(updateAll, UPDATE_INTERVAL_MS);

  // redraw em resize (para manter responsivo)
  let t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => updateAll(true), 200);
  });
}

/* --------- Função principal: busca CSV e atualiza charts --------- */
async function updateAll(isResize=false){
  try{
    const csv = await fetchCSV(CSV_URL);
    const rows = parseCSV(csv);

    // filtra linhas válidas (remover cabeçalho, linhas vazias)
    let dataRows = rows.filter(r => r.length >= 2 && r[0] && r[1]);

    // pega últimas N
    if(dataRows.length > ROW_LIMIT) dataRows = dataRows.slice(-ROW_LIMIT);

    // Construir DataTables
    const dtTemp = new google.visualization.DataTable();
    dtTemp.addColumn('string','DateTime');
    dtTemp.addColumn('number','Temperatura');

    const dtUmid = new google.visualization.DataTable();
    dtUmid.addColumn('string','DateTime');
    dtUmid.addColumn('number','Umidade');

    const dtLdr = new google.visualization.DataTable();
    dtLdr.addColumn('string','DateTime');
    dtLdr.addColumn('number','LDR');

    // dataRows é array de arrays: [A,B,C,D,E]
    dataRows.forEach(cols => {
      const datetime = cols[0];
      const temp = parseNumber(cols[1]);
      const ldr  = parseNumber(cols[2]);
      const um  = parseNumber(cols[3]);

      // somente adicionar se número for válido
      dtTemp.addRow([datetime, isFinite(temp) ? temp : null]);
      dtUmid.addRow([datetime, isFinite(um) ? um : null]);
      dtLdr.addRow([datetime, isFinite(ldr) ? ldr : null]);
    });

    // meta (último valor)
    const last = dataRows[dataRows.length - 1];
    if(last){
      document.getElementById('metaTemp').textContent = `Último: ${last[1]} — ${last[0]}`;
      document.getElementById('metaUmid').textContent = `Último: ${last[3]} — ${last[0]}`;
      document.getElementById('metaLdr').textContent = `Último: ${last[2]} — ${last[0]}`;
    }

    // redimensionar opções base conforme largura (opcional)
    const w = document.getElementById('chartTemp').clientWidth;
    const optsTemp = Object.assign({}, optionsBase);
    const optsUmid = Object.assign({}, optionsBase);
    const optsLdr = Object.assign({}, optionsBase);

    // exemplo: reduzir tamanho da fonte se tela pequena
    if(w < 480){
      optsTemp.hAxis.textStyle = {fontSize:9};
      optsTemp.vAxis.textStyle = {fontSize:10};
      optsUmid.hAxis.textStyle = {fontSize:9};
      optsLdr.hAxis.textStyle = {fontSize:9};
    }

    // desenhar (animação curta para parecer suave)
    chartTemp.draw(dtTemp, optsTemp);
    chartUmid.draw(dtUmid, optsUmid);
    chartLdr.draw(dtLdr, optsLdr);

    if(isResize) console.debug('Redraw por resize');
  }catch(err){
    console.error('Falha ao atualizar dados:', err);
  }
}

/* --------- Utilitários --------- */
function parseNumber(v){
  if(v === null || v === undefined) return NaN;
  // remover possíveis espaços e vírgulas -> ponto decimal
  return Number(String(v).replace(',', '.'));
}

// fetch CSV (retorna string)
async function fetchCSV(url){
  const res = await fetch(url, {cache: "no-store"});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}

// parse CSV simples (suporta aspas)
function parseCSV(text){
  // split por linhas, mas lidar com CRLF
  const lines = text.split(/\r?\n/).filter(Boolean);

  // primeira linha = header -> remover
  if(lines.length === 0) return [];
  const header = lines.shift();

  const rows = lines.map(line => parseCSVLine(line));
  return rows;
}

// parse uma linha CSV (manejo de aspas simples)
function parseCSVLine(line){
  const out = [];
  let cur = '';
  let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"' ){
      // se próximo também é ", é escape
      if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; continue; }
      inQuotes = !inQuotes;
      continue;
    }
    if(ch === ',' && !inQuotes){
      out.push(cur);
      cur = '';
      continue;
    }
    cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

</script>
</body>
</html>
